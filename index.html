<script>
const {createClient}=supabase;const sb=createClient(BYJAEI_CONFIG.supabaseUrl,BYJAEI_CONFIG.supabaseKey);let products=[],siteCategories=[],category='ALL',categoryId=null,brandFilter='ALL',user=null,approved=false,cart=[],detailReturnToCart=false,quickView='all',checkoutDraft=null;
let loyaltyPointsBalance=0, checkoutProductTotal=0, loyaltyPointsReady=false;
let currentProductPage=1, lastProductFilterKey='', orderSubmissionInProgress=false; const PRODUCTS_PER_PAGE=30;
const guestCartKey='byjaei_cart_guest',favoriteKey='byjaei_favorites_v1',recentKey='byjaei_recent_v1';
function readIdList(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v.map(String):[]}catch{return []}}
function writeIdList(key,ids){localStorage.setItem(key,JSON.stringify(ids.map(String)))}
function favoriteIds(){return readIdList(favoriteKey)}
function recentIds(){return readIdList(recentKey)}
function isFavorite(id){return favoriteIds().includes(String(id))}

function categoryTreeRows(parentId=null,depth=0,rows=[]){
  siteCategories.filter(c=>String(c.parent_id??'')===String(parentId??'')).sort((x,y)=>(Number(x.sort_order)||0)-(Number(y.sort_order)||0)||String(x.name).localeCompare(String(y.name),'ko-KR',{numeric:true})).forEach(c=>{rows.push({c,depth});categoryTreeRows(c.id,depth+1,rows)});
  return rows;
}
function categoryDescendantNames(name,rootId=null){
  const clean=v=>String(v||'').replace(/\s+/g,'').toUpperCase();
  const roots=rootId!=null
    ? siteCategories.filter(c=>String(c.id)===String(rootId))
    : siteCategories.filter(c=>String(c.name)===String(name));
  if(!roots.length)return [String(name)];
  const out=new Set(),visited=new Set();
  const walk=id=>{
    const key=String(id);
    if(visited.has(key))return;
    visited.add(key);
    const c=siteCategories.find(x=>String(x.id)===key);
    if(c&&clean(c.name)!=='26WINTER(전체보기)')out.add(String(c.name));
    siteCategories.filter(x=>String(x.parent_id??'')===key).forEach(x=>walk(x.id));
  };
  roots.forEach(root=>walk(root.id));
  return [...out];
}
function categoryBranchIds(id){
  const out=new Set();
  if(id==null||id==='')return out;
  const walk=currentId=>{
    const key=String(currentId);
    if(out.has(key))return;
    out.add(key);
    siteCategories.filter(c=>String(c.parent_id??'')===key).forEach(c=>walk(c.id));
  };
  walk(id);
  return out;
}
function uniqueCategoryIdForName(name){
  const matches=siteCategories.filter(c=>String(c.name)===String(name));
  return matches.length===1?String(matches[0].id):null;
}
function isCustomerCategoryHidden(id){
  if(id==null||id==='')return false;
  let current=siteCategories.find(c=>String(c.id)===String(id));
  const seen=new Set();
  while(current&&!seen.has(String(current.id))){
    if(current.is_hidden===true)return true;
    seen.add(String(current.id));
    current=current.parent_id==null?null:siteCategories.find(c=>String(c.id)===String(current.parent_id));
  }
  return false;
}

function cats(){
  const clean=v=>String(v||'').replace(/\s+/g,'').toUpperCase();
  const rows=categoryTreeRows().filter(({c})=>clean(c.name)!=='26WINTER(전체보기)'&&!isCustomerCategoryHidden(c.id));
  const catEl=document.getElementById('cats');
  const roots=rows.filter(({c})=>c.parent_id==null).map(({c})=>c);
  const escape=v=>String(v).replaceAll('"','&quot;');
  const childrenOf=c=>siteCategories.filter(x=>String(x.parent_id??'')===String(c.id) && clean(x.name)!=='26WINTER(전체보기)'&&!isCustomerCategoryHidden(x.id))
    .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.name).localeCompare(String(b.name),'ko-KR',{numeric:true}));
  const selectedCategory=category==='ALL'||category==='BRAND'?null:(categoryId?siteCategories.find(x=>String(x.id)===String(categoryId)):siteCategories.find(x=>String(x.name)===String(category)));
  const rootOf=c=>{
    let current=c;
    const seen=new Set();
    while(current && current.parent_id!=null && !seen.has(String(current.id))){
      seen.add(String(current.id));
      current=siteCategories.find(x=>String(x.id)===String(current.parent_id))||null;
    }
    return current||c;
  };
  const displayRoot=selectedCategory?rootOf(selectedCategory):null;
  const selectedChildren=displayRoot?childrenOf(displayRoot):[];
  const title=category==='ALL'?'':category==='BRAND'?'BRAND':String(displayRoot?.name||category);
  const normalHtml=roots.map(c=>{
    const isActive=displayRoot?String(displayRoot.id)===String(c.id):category===c.name;
    return `<button type="button" class="${isActive?'active':''}" data-category="${escape(c.name)}" data-category-id="${c.id}">${c.name}</button>`;
  }).join('');
  catEl.innerHTML=`<div class="catScroll"><div class="catTopRow">${normalHtml}<button type="button" class="${category==='BRAND'?'active':''}" data-category="BRAND">BRAND</button></div></div>${title?`<div class="catTitle">${escape(title)}</div>`:''}${selectedChildren.length?`<div class="catSubScroll"><div class="catSubRow">${selectedChildren.map(c=>`<button type="button" class="${selectedCategory&&String(selectedCategory.id)===String(c.id)?'active':''}" data-category="${escape(c.name)}" data-category-id="${c.id}">${c.name}</button>`).join('')}</div></div>`:''}`;
  const brandEl=document.getElementById('brandCats');
  if(category!=='BRAND'){
    brandEl.hidden=true; brandEl.innerHTML=''; return;
  }
  const collator=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});
  const brands=[...new Set(customerVisibleProducts().map(p=>String(p.brand||'').trim()).filter(Boolean))].sort((a,b)=>collator.compare(a,b));
  brandEl.hidden=false;
  brandEl.innerHTML=['ALL',...brands].map(x=>`<button type="button" class="${brandFilter===x?'active':''}" data-brand="${x.replaceAll('"','&quot;')}">${x}</button>`).join('');
}

function render(){
  const accountLink=document.querySelector('.loginLink');
  if(accountLink)accountLink.textContent=user?'MYPAGE':'LOGIN';
  cats();renderQuickLinks();
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filterKey=JSON.stringify([category,categoryId,brandFilter,quickView,q]);
  if(filterKey!==lastProductFilterKey){currentProductPage=1;lastProductFilterKey=filterKey;}
  const favIds=favoriteIds(),recentProductIds=recentIds(),newCutoff=Date.now()-30*24*60*60*1000;
  const visibleProducts=customerVisibleProducts();
  let a=visibleProducts.filter(p=>{
    const created=Date.parse(p.created_at||'')||0;
    const viewOk=quickView==='new'?created>=newCutoff:quickView==='favorites'?favIds.includes(String(p.id)):quickView==='recent'?recentProductIds.includes(String(p.id)):true;
    const productCategory=String(p.category||'').trim();
    let categoryOk=category==='ALL'||category==='BRAND';
    if(!categoryOk){
      const branchIds=categoryBranchIds(categoryId);
      if(p.category_id!=null){
        categoryOk=branchIds.has(String(p.category_id));
      }else{
        const legacyId=uniqueCategoryIdForName(productCategory);
        categoryOk=!!legacyId&&branchIds.has(String(legacyId));
      }
    }
    const brandOk=category!=='BRAND'||brandFilter==='ALL'||String(p.brand||'').trim()===brandFilter;
    return viewOk&&categoryOk&&brandOk&&String(p.name||'').toLowerCase().includes(q);
  });

  const stamp=v=>{
    const n=Date.parse(v||'');
    return Number.isFinite(n)?n:0;
  };
  const updateStamp=p=>stamp(p.updated_at)||stamp(p.created_at);
  const isSizeChartProduct=p=>p?.is_size_chart===true||/사이즈\s*표|size\s*guide/i.test(String(p?.name||''));
  const overallView=category==='ALL'||(category==='BRAND'&&brandFilter==='ALL');

  if(overallView){
    // 전체 상품(ALL)일 때 새로 등록된 상품(created_at)이 무조건 가장 먼저 오도록 최신순 정렬
    a.sort((x,y)=>stamp(y.created_at)-stamp(x.created_at)||updateStamp(y)-updateStamp(x)||(Number(x.sort_order)||0)-(Number(y.sort_order)||0));
  }else if(category!=='BRAND'){
    const selectedRow=categoryId?siteCategories.find(c=>String(c.id)===String(categoryId)):siteCategories.find(c=>String(c.name)===String(category));
    const exactCategoryId=selectedRow?String(selectedRow.id):null;
    const legacyCanResolve=selectedRow&&siteCategories.filter(c=>String(c.name)===String(selectedRow.name)).length===1;
    const categoryMatches=p=>p.category_id!=null
      ? String(p.category_id)===exactCategoryId
      : (!!legacyCanResolve&&String(p.category||'').trim()===String(selectedRow.name));
    const isPinnedHere=p=>categoryMatches(p)&&Number(p.sort_order)<0;
    const scopedOrder=p=>{
      if(isSizeChartProduct(p)&&Number(p.sort_order)<0&&!categoryMatches(p)) return Number.MAX_SAFE_INTEGER;
      return Number(p.sort_order)||0;
    };
    a.sort((x,y)=>{
      const xp=isPinnedHere(x),yp=isPinnedHere(y);
      if(xp!==yp)return xp?-1:1;
      return stamp(y.created_at)-stamp(x.created_at)||scopedOrder(x)-scopedOrder(y);
    });
  }else{
    a.sort((x,y)=>stamp(y.created_at)-stamp(x.created_at)||updateStamp(y)-updateStamp(x)||(Number(x.sort_order)||0)-(Number(y.sort_order)||0));
  }

  if(quickView==='new'){
    a.sort((x,y)=>(Date.parse(y.created_at||'')||0)-(Date.parse(x.created_at||'')||0)||(Date.parse(y.updated_at||'')||0)-(Date.parse(x.updated_at||'')||0));
  }else if(quickView==='favorites'){
    a.sort((x,y)=>favIds.indexOf(String(x.id))-favIds.indexOf(String(p?.id||'')));
  }else if(quickView==='recent'){
    a.sort((x,y)=>recentProductIds.indexOf(String(x.id))-recentProductIds.indexOf(String(p?.id||'')));
  }

  // 중복 상품 제거 기능 유지
  const normalizeProductName=v=>String(v??'')
    .normalize('NFKC')
    .replace(/[\s\u00a0]+/g,'')
    .trim()
    .toLocaleLowerCase('ko-KR');
  const seenProducts=new Set();
  a=a.filter(p=>{
    const key=normalizeProductName(p.name);
    if(!key) return true;
    if(seenProducts.has(key)) return false;
    seenProducts.add(key);
    return true;
  });

  const totalPages=Math.max(1,Math.ceil(a.length/PRODUCTS_PER_PAGE));
  currentProductPage=Math.max(1,Math.min(currentProductPage,totalPages));
  const pageStart=(currentProductPage-1)*PRODUCTS_PER_PAGE;
  const pageProducts=a.slice(pageStart,pageStart+PRODUCTS_PER_PAGE);
  document.getElementById('grid').innerHTML=a.length?pageProducts.map(card).join(''):'<div class="empty">등록된 상품이 없어요 🤍</div>';
  renderPagination(a.length);
}
function renderPagination(totalItems){
  const nav=document.getElementById('pagination');
  if(!nav)return;
  const pages=Math.ceil(totalItems/PRODUCTS_PER_PAGE);
  nav.dataset.totalPages=String(Math.max(1,pages));
  if(pages<=1){nav.hidden=true;nav.innerHTML='';return;}
  nav.hidden=false;
  const parts=[];
  parts.push(`<button type="button" aria-label="이전 페이지" ${currentProductPage<=1?'disabled':''} onclick="goToProductPage(${currentProductPage-1})">‹</button>`);
  const included=new Set([1,pages]);
  for(let n=Math.max(1,currentProductPage-2);n<=Math.min(pages,currentProductPage+2);n++)included.add(n);
  const ordered=[...included].sort((a,b)=>a-b);
  let prev=0;
  for(const n of ordered){
    if(prev&&n-prev>1)parts.push('<span class="pageGap" aria-hidden="true">…</span>');
    parts.push(`<button type="button" class="${n===currentProductPage?'active':''}" ${n===currentProductPage?'aria-current="page"':''} onclick="goToProductPage(${n})">${n}</button>`);
    prev=n;
  }
  parts.push(`<button type="button" aria-label="다음 페이지" ${currentProductPage>=pages?'disabled':''} onclick="goToProductPage(${currentProductPage+1})">›</button>`);
  nav.innerHTML=parts.join('');
}
let productPageChangeTimer=null;
function goToProductPage(page){
  const nav=document.getElementById('pagination');
  const totalPages=Number(nav?.dataset.totalPages)||Math.max(1,Math.ceil(products.length/PRODUCTS_PER_PAGE));
  const nextPage=Math.max(1,Math.min(totalPages,Math.floor(Number(page)||1)));
  if(nextPage===currentProductPage)return;
  const grid=document.getElementById('grid');
  if(window.matchMedia('(max-width: 620px)').matches&&grid){
    if(productPageChangeTimer)clearTimeout(productPageChangeTimer);
    const header=document.querySelector('header');
    const headerHeight=header?header.getBoundingClientRect().height:0;
    const targetTop=window.scrollY+grid.getBoundingClientRect().top-headerHeight-12;
    window.scrollTo({top:Math.max(0,targetTop),behavior:'smooth'});
    grid.classList.remove('page-fade-in');
    grid.classList.add('page-fade-out');
    productPageChangeTimer=setTimeout(()=>{
      currentProductPage=nextPage;
      render();
      grid.classList.remove('page-fade-out');
      grid.classList.add('page-fade-in');
      requestAnimationFrame(()=>requestAnimationFrame(()=>grid.classList.remove('page-fade-in')));
      productPageChangeTimer=null;
    },150);
    return;
  }
  currentProductPage=nextPage;
  render();
}

async function loadCheckoutPointBalance(subtotal){
  checkoutProductTotal=Math.max(0,Math.round(Number(subtotal)||0));
  loyaltyPointsBalance=0;loyaltyPointsReady=false;
  const balanceEl=document.getElementById('checkoutPointsBalance');
  const input=document.getElementById('pointsToUse');
  const allBtn=document.getElementById('useAllPointsButton');
  const hint=document.getElementById('checkoutPointsHint');
  if(!balanceEl||!input)return;
  input.value='0';input.disabled=true;if(allBtn)allBtn.disabled=true;
  const {data:{user:currentUser},error:authError}=await sb.auth.getUser();
  if(authError||!currentUser){balanceEl.textContent='0원';if(hint)hint.textContent='로그인한 회원만 적립금을 사용할 수 있어요.';updateCheckoutPointsPreview();return}
  try{
    const {data,error}=await sb.rpc('get_my_loyalty_points_balance');
    if(error)throw error;
    loyaltyPointsBalance=Math.max(0,Math.floor(Number(data)||0));loyaltyPointsReady=true;
    balanceEl.textContent=won(loyaltyPointsBalance);
    input.disabled=false;input.max=String(Math.min(loyaltyPointsBalance,checkoutProductTotal));
    if(allBtn)allBtn.disabled=!(loyaltyPointsBalance>0&&checkoutProductTotal>0);
    if(hint)hint.textContent=loyaltyPointsBalance>0?`최대 ${won(Math.min(loyaltyPointsBalance,checkoutProductTotal))}까지 사용할 수 있어요.`:'사용 가능한 적립금이 없어요.';
  }catch(e){
    console.warn('체크아웃 적립금 조회 실패:',e);
    balanceEl.textContent='확인 필요';input.disabled=true;if(allBtn)allBtn.disabled=true;
    if(hint)hint.textContent='적립금 설정을 확인할 수 없어 이번 주문에서는 적립금 사용을 잠시 제한했어요.';
  }
  updateCheckoutPointsPreview();
}
function requestedCheckoutPoints(){const el=document.getElementById('pointsToUse');return Math.max(0,Math.floor(Number(el?.value)||0))}
function updateCheckoutPointsPreview(){
  const input=document.getElementById('pointsToUse');const hint=document.getElementById('checkoutPointsHint');const totalEl=document.getElementById('checkoutPointsFinalTotal');if(!totalEl)return;

  const el=document.getElementById('login');
  el.hidden=false;
  let {data:{session}}=await sb.auth.getSession();
  if(session){
    user=session.user;
    el.innerHTML=`<div class="inner"><div class="topbar myPageTopbar"><button class="back" onclick="closeLayer('login')">←</button><b>MYPAGE</b><span></span></div><div class="loginForm myPageForm"><div class="accountWelcome"><span class="accountEyebrow">회원 정보</span><p class="accountEmail">${safeText(user.email)}</p><p class="small">${approved?'회원 승인이 완료되어 회원가가 적용돼요.':'회원 승인 대기 중이에요.'}</p></div><div class="loyaltyCard" id="myPageLoyaltyCard"><div class="loyaltyCardHead"><div><div class="loyaltyCardLabel">보유 적립금</div><div id="myPagePointsBalance" class="loyaltyCardValue">조회 중...</div></div><span aria-hidden="true" style="font-size:24px;color:#a78c73">♡</span></div><div id="myPagePointsHint" class="small" style="margin-top:5px">적립금 잔액을 확인하고 있어요.</div><div id="myPagePointsHistory" class="loyaltyHistory" hidden></div></div><button onclick="loadMyOrders()">주문 내역 확인 <span aria-hidden="true">↗</span></button><button class="secondary" onclick="logout()">LOG OUT</button></div></div>`;
    loadMyPageLoyalty();
  }else{
    const saved=localStorage.getItem('byjaei_saved_email')||'';
    el.innerHTML=`<div class="inner"><div class="topbar"><button class="back" onclick="closeLayer('login')">←</button><b>회원</b><span></span></div><div class="loginForm"><input id="email" placeholder="이메일" value="${saved.replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')login()"><input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()"><label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:2px 0 8px;cursor:pointer"><input id="saveEmail" type="checkbox" style="width:auto;margin:0" ${saved?'checked':''}> 이메일/아이디 저장</label><button onclick="login()">로그인</button><button class="secondary" onclick="signup()">회원가입</button></div></div>`;
  }
}
async function login(){let e=document.getElementById('email').value.trim(),p=document.getElementById('pw').value;if(!e||!p)return alert('이메일과 비밀번호를 입력해주세요.');if(document.getElementById('saveEmail')?.checked)localStorage.setItem('byjaei_saved_email',e);else localStorage.removeItem('byjaei_saved_email');let {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){return alert(error.message||'로그인에 실패했어요.')}const {data:pr}=await sb.from('profiles').select('approved,withdrawn').eq('id',(await sb.auth.getUser()).data.user.id).maybeSingle();if(pr?.withdrawn){await sb.auth.signOut();user=null;approved=false;return alert('탈퇴 처리된 회원이에요.\n새로 가입해서 이용해주세요.')}if(!pr?.approved){await sb.auth.signOut();user=null;approved=false;return alert('승인대기중이에요.\n관리자 승인 후 이용 가능해요.')}await refreshUser();closeLayer('login');render()}
async function signup(){closeAll();const el=document.getElementById('login');el.hidden=false;el.innerHTML=`<div class="inner"><div class="topbar"><button class="back" onclick="openLogin()">← 돌아가기</button><b>회원가입</b><span></span></div><div class="loginForm"><input id="signupName" placeholder="이름"><input id="signupPhone" type="tel" placeholder="연락처"><input id="signupEmail" type="email" placeholder="이메일"><input id="signupPw" type="password" placeholder="비밀번호 (6자 이상)"><input id="signupPwConfirm" type="password" placeholder="비밀번호 확인 (다시 입력)"><label for="signupReferral" style="display:block;font-size:12px;color:var(--muted);margin:2px 0 -4px">가입경로 (필수로 작성 부탁드려요)</label><input id="signupReferral" required placeholder="예: ㅇㅇㅇ 맘카페, ㅇㅇㅇ 인스타, 지인 ㅇㅇㅇ"><div class="small" style="margin-top:-4px">가입 경로를 꼭 작성해주세요.</div><button onclick="submitSignup()">회원가입</button><div class="small">가입 후 관리자 승인 전까지는 회원가가 적용되지 않아요.</div></div></div>`}
async function submitSignup(){const name=document.getElementById('signupName').value.trim(),phone=document.getElementById('signupPhone').value.trim(),e=document.getElementById('signupEmail').value.trim(),p=document.getElementById('signupPw').value,pc=document.getElementById('signupPwConfirm').value,ref=document.getElementById('signupReferral').value.trim();if(!name||!phone||!e||p.length<6)return alert('이름, 연락처, 이메일을 입력하고 비밀번호는 6자 이상으로 설정해주세요.');if(!ref)return alert('가입경로를 필수로 작성해주세요. 예: ㅇㅇㅇ 맘카페, ㅇㅇㅇ 인스타, 지인 ㅇㅇㅇ 등');if(p!==pc)return alert('비밀번호와 비밀번호 확인이 일치하지 않아요.');const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name,phone,referral_source:ref}}});if(error)return alert(error.message);if(data.user){const {error:pe}=await sb.from('profiles').upsert({id:data.user.id,name,email:e,phone,referral_source:ref,approved:false},{onConflict:'id'});if(pe)console.warn('프로필 저장은 트리거에서 처리됩니다.',pe)}alert('가입이 완료됐어요.\n🤍\n\n승인대기중이에요.\n관리자 승인 후 이용 가능해요.');openLogin()}
async function logout(){await sb.auth.signOut();user=null;approved=false;checkoutDraft=null;closeLayer('login');render()}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()})
async function refreshUser(){
  let {data:{user:u}}=await sb.auth.getUser();
  user=u||null;
  approved=false;
  if(user){
    const {data:p}=await sb.from('profiles').select('approved,is_admin,withdrawn').eq('id',user.id).maybeSingle();
    if(p?.withdrawn){await sb.auth.signOut(); user=null; approved=false; return;} approved=!!p?.approved;
  }
}
function closeLayer(id){document.getElementById(id).hidden=true}function closeAll(){detailReturnToCart=false;['detail','cart','login'].forEach(x=>document.getElementById(x).hidden=true)}
sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;loadCart();render()});
refreshUser().then(()=>{loadCart();return load()});
</script></body></html>
