<script>
const {createClient}=supabase;const sb=createClient(BYJAEI_CONFIG.supabaseUrl,BYJAEI_CONFIG.supabaseKey);let products=[],siteCategories=[],category='ALL',categoryId=null,brandFilter='ALL',typeFilter='ALL',subTypeFilter='ALL',user=null,approved=false,cart=[],detailReturnToCart=false,quickView='all',checkoutDraft=null;
let loyaltyPointsBalance=0, checkoutProductTotal=0, loyaltyPointsReady=false;
let sortMode='default',authReady=false,authReadyResolve=null;const authReadyPromise=new Promise(r=>{authReadyResolve=r});
let currentProductPage=1, lastProductFilterKey='', orderSubmissionInProgress=false; const PRODUCTS_PER_PAGE=30;
const guestCartKey='byjaei_cart_guest',favoriteKey='byjaei_favorites_v1',recentKey='byjaei_recent_v1';
let productsLoaded=false,cartViewMode='',favoritesServerOk=null,loadPromise=null;
function readIdList(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v.map(String):[]}catch{return []}}
function writeIdList(key,ids){localStorage.setItem(key,JSON.stringify(ids.map(String)))}
function favKey(){return user?.id?`${favoriteKey}_${user.id}`:favoriteKey}
function favoriteIds(){return readIdList(favKey())}
function recentIds(){return readIdList(recentKey)}
function isFavorite(id){return favoriteIds().includes(String(id))}
function pendingKey(){return `byjaei_fav_pending_${user?.id||'guest'}`}
function readPending(){try{const v=JSON.parse(localStorage.getItem(pendingKey())||'{}');return {add:Array.isArray(v.add)?v.add.map(String):[],remove:Array.isArray(v.remove)?v.remove.map(String):[]}}catch{return {add:[],remove:[]}}}
function writePending(p){localStorage.setItem(pendingKey(),JSON.stringify(p))}
function markPending(sid,adding){const p=readPending();p.add=p.add.filter(x=>x!==sid);p.remove=p.remove.filter(x=>x!==sid);(adding?p.add:p.remove).push(sid);writePending(p)}
function clearPending(sid){const p=readPending();p.add=p.add.filter(x=>x!==sid);p.remove=p.remove.filter(x=>x!==sid);writePending(p)}
function toggleFavorite(id){
  let ids=favoriteIds();const sid=String(id);const adding=!ids.includes(sid);
  ids=adding?[sid,...ids.filter(x=>x!==sid)]:ids.filter(x=>x!==sid);
  writeIdList(favKey(),ids);
  if(user){
    markPending(sid,adding);
    const op=adding?sb.from('user_favorites').upsert({user_id:user.id,product_id:Number(id)},{onConflict:'user_id,product_id'}):sb.from('user_favorites').delete().eq('user_id',user.id).eq('product_id',Number(id));
    Promise.resolve(op).then(({error})=>{if(error){favoritesServerOk=false;console.warn('관심상품 서버 저장 실패(BYJAEI_favorites.sql 필요):',error.message)}else{clearPending(sid)}}).catch(e=>{favoritesServerOk=false;console.warn(e)});
  }
  render();
}
async function syncFavorites(){
  if(!user)return;
  try{
    /* 1) 이 기기에서 아직 서버에 못 올린 변경분을 먼저 올려요 */
    const pend=readPending();
    const guestLocal=readIdList(favoriteKey); /* 로그인 전에 눌러둔 하트 */
    const toAdd=[...new Set([...pend.add,...guestLocal])].filter(x=>/^\d+$/.test(x));
    if(toAdd.length){const {error:e1}=await sb.from('user_favorites').upsert(toAdd.map(id=>({user_id:user.id,product_id:Number(id)})),{onConflict:'user_id,product_id'});if(e1)throw e1}
    const toRemove=pend.remove.filter(x=>/^\d+$/.test(x));
    if(toRemove.length){const {error:e2}=await sb.from('user_favorites').delete().eq('user_id',user.id).in('product_id',toRemove.map(Number));if(e2)throw e2}
    writePending({add:[],remove:[]});
    localStorage.removeItem(favoriteKey);
    /* 2) 서버 목록을 기준으로 화면을 맞춰요 (다른 기기·브라우저 데이터가 지워져도 복구) */
    const {data,error}=await sb.from('user_favorites').select('product_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
    if(error)throw error;
    favoritesServerOk=true;
    writeIdList(favKey(),(data||[]).map(r=>String(r.product_id)));
    render();
  }catch(e){favoritesServerOk=false;console.warn('관심상품 서버 연동 불가 — 이 기기에만 저장돼요 (BYJAEI_favorites.sql 필요):',e&&e.message||e)}
}
function soldFlag(p){return !!p&&(p.is_sold_out===true||p.sold_out===true)}
function isSoldOutProduct(p){return !p||soldFlag(p)||p.__missing===true}
function isOrderableItem(x){const p=products.find(p=>String(p.id)===String(x.id));return !isSoldOutProduct(p)}
async function syncSoldOut(ids){
  const uniq=[...new Set((ids||[]).map(String))].filter(s=>/^\d+$/.test(s));
  if(!uniq.length||!user)return false;
  try{
    const {data,error}=await sb.from('products').select('*').in('id',uniq.map(Number));
    if(error)throw error;
    let changed=false;const found=new Set();
    (data||[]).forEach(r=>{
      found.add(String(r.id));
      const p=products.find(x=>String(x.id)===String(r.id));
      if(p){if(soldFlag(p)!==soldFlag(r)){p.sold_out=soldFlag(r);p.is_sold_out=soldFlag(r);changed=true}if(p.__missing){p.__missing=false;changed=true}}
    });
    uniq.forEach(id=>{const p=products.find(x=>String(x.id)===id);if(p&&!found.has(id)&&!p.__missing){p.__missing=true;changed=true}});
    return changed;
  }catch(e){console.warn('품절 상태 확인 실패',e);return false}
}
function setSort(v){sortMode=(v==='low'||v==='high')?v:'default';currentProductPage=1;render()}
function setQuickView(view){resetSearchBox();quickView=view||'all';category='ALL';categoryId=null;brandFilter='ALL';typeFilter='ALL';subTypeFilter='ALL';render();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuickLinks(){const el=document.getElementById('quickLinks');if(!el)return;el.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===quickView))}
function rememberRecent(id){const ids=recentIds().filter(x=>x!==String(id));ids.unshift(String(id));writeIdList(recentKey,ids.slice(0,30))}
function cartKey(){return user?.id?`byjaei_cart_${user.id}`:guestCartKey}
function mergeGuestCart(){
  /* 로그인 전에 게스트 키에 담긴 상품이 있으면 회원 장바구니로 합쳐요 */
  try{
    if(!user?.id)return;
    const g=JSON.parse(localStorage.getItem(guestCartKey)||'[]');
    if(!Array.isArray(g)||!g.length)return;
    const mine=JSON.parse(localStorage.getItem(cartKey())||'[]');
    const base=Array.isArray(mine)?mine:[];
    g.forEach(it=>{const f=base.find(x=>x.key===it.key);f?f.qty=Math.max(Number(f.qty)||1,Number(it.qty)||1):base.push(it)});
    localStorage.setItem(cartKey(),JSON.stringify(base));
    localStorage.removeItem(guestCartKey);
  }catch(e){console.warn('게스트 장바구니 병합 실패',e)}
}
function loadCart(){
  mergeGuestCart();
  try{
    const raw=localStorage.getItem(cartKey());
    const parsed=raw?JSON.parse(raw):[];
    cart=Array.isArray(parsed)?parsed:[];
  }catch(e){console.warn('장바구니 데이터를 복구했어요.',e);cart=[];localStorage.removeItem(cartKey())}
}
function save(){localStorage.setItem(cartKey(),JSON.stringify(cart))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';const getPrice=p=>approved&&user?(p.member_price??p.normal_price):p.normal_price;
function parseSize(v){const s=String(v??'').replace(/＋/g,'+').replace(/（/g,'(').replace(/）/g,')');const m=s.match(/^(.+?)\s*[\(\[]\s*\+\s*([\d,]+)\s*(?:원|won)?\s*[\)\]]\s*$/i);return m?{name:m[1].trim(),add:Number(m[2].replace(/,/g,''))||0}:{name:s.trim(),add:0}}
async function fetchAllProducts(){const size=1000;let from=0,all=[];while(true){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+size-1);if(error)return {data:null,error};all=all.concat(data||[]);if(!data||data.length<size)break;from+=size}return {data:all,error:null}}
function load(){if(loadPromise)return loadPromise;loadPromise=loadImpl().finally(()=>{loadPromise=null});return loadPromise}
async function loadImpl(){
  if(!user){products=[];siteCategories=[];productsLoaded=false;render();return}
  const [{data:productData,error:productError},{data:categoryData,error:categoryError}]=await Promise.all([
    fetchAllProducts(),
    sb.from('categories').select('id,name,parent_id,sort_order,created_at,is_hidden').order('sort_order',{ascending:true}).order('created_at',{ascending:true})
  ]);
  if(productError){console.error(productError);grid.innerHTML='<div class="empty">상품을 불러오지 못했어요. Supabase 연결을 확인해주세요.</div>';return}
  products=productData||[];
  productsLoaded=true;
  siteCategories=categoryError?[]:(categoryData||[]);

}
function updateSearchClear(){const el=document.getElementById('search'),b=document.getElementById('searchClear');if(b)b.hidden=!(el&&el.value)}
function resetSearchBox(){const el=document.getElementById('search');if(el&&el.value){el.value='';updateSearchClear()}}
function onSearchInput(){updateSearchClear();render()}

function brandKey(v){return String(v??'').normalize('NFKC').replace(/[\s\u00a0\u200b-\u200d\ufeff]+/g,'').toLocaleLowerCase('ko-KR')}
const PRODUCT_TYPE_TOP=['아우터','상의','하의','원피스·세트','악세사리'];
const PRODUCT_TYPE_ACC_SUB=['모자','신발','양말','헤어','기타'];
const __accChainCache=new Map();
function isAccCategoryChain(id){
  if(id==null||id==='')return false;
  const ck=String(id)+'|'+siteCategories.length;
  if(__accChainCache.has(ck))return __accChainCache.get(ck);
  let cur=siteCategories.find(c=>String(c.id)===String(id)),res=false;const seen=new Set();
  while(cur&&!seen.has(String(cur.id))){
    if(/acc/i.test(String(cur.name||''))){res=true;break}
    seen.add(String(cur.id));
    cur=cur.parent_id==null?null:siteCategories.find(c=>String(c.id)===String(cur.parent_id));
  }
  __accChainCache.set(ck,res);return res;
}
function accSubFromCategoryName(n){
  n=String(n||'').trim();
  if(/모자/.test(n))return'모자';
  if(/신발/.test(n))return'신발';
  if(/양말|타이즈/.test(n))return'양말';
  if(/헤어|핀/.test(n))return'헤어';
  if(n==='기타')return'기타';
  return null;
}
/* 악세사리 세부 종류: ACC 카테고리 안의 상품은 카테고리 이름(모자/신발/…)을 우선, 없으면 상품 종류값, 그래도 없으면 기타 */
function accSubOf(p){
  const t=String(p.product_type||'');
  const typeSub=t.startsWith('악세사리/')?t.slice(5):null;
  if(p.category_id!=null&&isAccCategoryChain(p.category_id)){
    const c=siteCategories.find(x=>String(x.id)===String(p.category_id));
    return accSubFromCategoryName(c?c.name:p.category)||typeSub||'기타';
  }
  return typeSub;
}
/* 26WINTER ACC 처럼 악세사리 묶음 카테고리를 보는 중이면 세부 버튼(모자/신발/양말/헤어/기타)을 보여줌 */
function accSubBarVisible(){
  if(category==='ALL'||category==='BRAND'||categoryId==null||categoryId==='')return false;
  if(!isAccCategoryChain(categoryId))return false;
  const cur=siteCategories.find(c=>String(c.id)===String(categoryId));
  return !(cur&&accSubFromCategoryName(cur.name));
}
function productTypeMatches(p){
  if(category==='ALL'){
    if(typeFilter==='ALL')return true;
    if(typeFilter==='악세사리'){
      const sub=accSubOf(p);
      if(!sub)return false;
      return subTypeFilter==='ALL'||sub===subTypeFilter;
    }
    return String(p.product_type||'')===typeFilter;
  }
  if(accSubBarVisible()){
    return subTypeFilter==='ALL'||(accSubOf(p)||'기타')===subTypeFilter;
  }
  return true;
}
function setTypeFilter(x){typeFilter=x||'ALL';subTypeFilter='ALL';currentProductPage=1;render()}
function setSubTypeFilter(x){subTypeFilter=x||'ALL';currentProductPage=1;render()}
function renderTypeFilters(){
  const el=document.getElementById('typeCats');if(!el)return;
  const row=(items,cur,attr,cls)=>`<div class="typeRow ${cls||''}">${['ALL',...items].map(x=>`<button type="button" class="${cur===x?'active':''}" ${attr}="${x}">${x}</button>`).join('')}</div>`;
  if(accSubBarVisible()){
    el.innerHTML=row(PRODUCT_TYPE_ACC_SUB,subTypeFilter,'data-subtype');
    el.hidden=false;return;
  }
  /* 분류값(product_type)이 DB에 아직 없으면 ALL 화면의 종류 버튼은 숨겨둠 */
  if(category!=='ALL'||!products.some(p=>p.product_type)){el.hidden=true;el.innerHTML='';return}
  el.innerHTML=row(PRODUCT_TYPE_TOP,typeFilter,'data-type')+(typeFilter==='악세사리'?row(PRODUCT_TYPE_ACC_SUB,subTypeFilter,'data-subtype','sub'):'');
  el.hidden=false;
}

  brandFilter=x;
  quickView='all';
  render();
}
function categoryTreeRows(parentId=null,depth=0,rows=[]){
  siteCategories.filter(c=>String(c.parent_id??'')===String(parentId??'')).sort((x,y)=>(Number(x.sort_order)||0)-(Number(y.sort_order)||0)||String(x.name).localeCompare(String(y.name),'ko-KR',{numeric:true})).forEach(c=>{rows.push({c,depth});categoryTreeRows(c.id,depth+1,rows)});
  return rows;
}
function categoryDescendantNames(name,rootId=null){
  const clean=v=>String(v||'').replace(/\s+/g,'').toUpperCase();
  const roots=rootId!=null
    ? siteCategories.filter(c=>String(c.id)===String(rootId))
    : siteCategories.filter(c=>String(c.name)===String(name));
  if(!roots.length)return [String(name)];
  const out=new Set(),visited=new Set();
  const walk=id=>{
    const key=String(id);
    if(visited.has(key))return;
    visited.add(key);
    const c=siteCategories.find(x=>String(x.id)===key);
    if(c&&clean(c.name)!=='26WINTER(전체보기)')out.add(String(c.name));
    siteCategories.filter(x=>String(x.parent_id??'')===key).forEach(x=>walk(x.id));
  };
  roots.forEach(root=>walk(root.id));
  return [...out];
}
function categoryBranchIds(id){
  const out=new Set();
  if(id==null||id==='')return out;
  const walk=currentId=>{
    const key=String(currentId);
    if(out.has(key))return;
    out.add(key);
    siteCategories.filter(c=>String(c.parent_id??'')===key).forEach(c=>walk(c.id));
  };
  walk(id);
  return out;
}
function uniqueCategoryIdForName(name){
  const matches=siteCategories.filter(c=>String(c.name)===String(name));
  return matches.length===1?String(matches[0].id):null;
}
function isCustomerCategoryHidden(id){
  if(id==null||id==='')return false;
  let current=siteCategories.find(c=>String(c.id)===String(id));
  const seen=new Set();
  while(current&&!seen.has(String(current.id))){
    if(current.is_hidden===true)return true;
    seen.add(String(current.id));
    current=current.parent_id==null?null:siteCategories.find(c=>String(c.id)===String(current.parent_id));
  }
  return false;
}
function productBelongsToHiddenCategory(p){
  if(!siteCategories||!siteCategories.length)return false;
  let id=null;
  if(p&&p.category_id!=null&&p.category_id!==''&&siteCategories.some(c=>String(c.id)===String(p.category_id)))id=p.category_id;
  else{const m=siteCategories.filter(c=>String(c.name)===String(p?.category||''));if(m.length===1)id=m[0].id}
  return id!=null&&isCustomerCategoryHidden(id);
}
function normalizedCustomerProductName(v){
  return String(v??'').normalize('NFKC').replace(/[\s\u00a0]+/g,'').trim().toLocaleLowerCase('ko-KR');
}
function customerVisibleProducts(){
  if(!siteCategories.some(c=>c.is_hidden===true))return products;
  return products.filter(p=>!productBelongsToHiddenCategory(p));
}
function cats(){
  const clean=v=>String(v||'').replace(/\s+/g,'').toUpperCase();
  const rows=categoryTreeRows().filter(({c})=>clean(c.name)!=='26WINTER(전체보기)'&&!isCustomerCategoryHidden(c.id));
  const catEl=document.getElementById('cats');
  const prevCatScroll=catEl.querySelector('.catScroll')?.scrollLeft||0;
  const roots=rows.filter(({c})=>c.parent_id==null).map(({c})=>c);
  const escape=v=>String(v).replaceAll('"','&quot;');
  const childrenOf=c=>siteCategories.filter(x=>String(x.parent_id??'')===String(c.id) && clean(x.name)!=='26WINTER(전체보기)'&&!isCustomerCategoryHidden(x.id))
    .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.name).localeCompare(String(b.name),'ko-KR',{numeric:true}));
  const selectedCategory=category==='ALL'||category==='BRAND'?null:(categoryId?siteCategories.find(x=>String(x.id)===String(categoryId)):siteCategories.find(x=>String(x.name)===String(category)));
  const rootOf=c=>{
    let current=c;
    const seen=new Set();
    while(current && current.parent_id!=null && !seen.has(String(current.id))){
      seen.add(String(current.id));
      current=siteCategories.find(x=>String(x.id)===String(current.parent_id))||null;
    }
    return current||c;
  };
  const displayRoot=selectedCategory?rootOf(selectedCategory):null;
  const selectedChildren=displayRoot?childrenOf(displayRoot):[];
  const title=category==='ALL'?'':category==='BRAND'?'BRAND':String(displayRoot?.name||category);
  const normalHtml=roots.map(c=>{
    const isActive=displayRoot?String(displayRoot.id)===String(c.id):category===c.name;
    return `<button type="button" class="${isActive?'active':''}" data-category="${escape(c.name)}" data-category-id="${c.id}">${c.name}</button>`;
  }).join('');
  catEl.innerHTML=`<div class="catScroll"><div class="catTopRow">${normalHtml}<button type="button" class="${category==='BRAND'?'active':''}" data-category="BRAND">BRAND</button></div></div>${title?`<div class="catTitle">${escape(title)}</div>`:''}${selectedChildren.length?`<div class="catSubScroll"><div class="catSubRow">${selectedChildren.map(c=>`<button type="button" class="${selectedCategory&&String(selectedCategory.id)===String(c.id)?'active':''}" data-category="${escape(c.name)}" data-category-id="${c.id}">${c.name}</button>`).join('')}</div></div>`:''}`;
  const newCatScroll=catEl.querySelector('.catScroll');if(newCatScroll&&prevCatScroll)newCatScroll.scrollLeft=prevCatScroll;
  renderTypeFilters();
  const brandEl=document.getElementById('brandCats');
  if(category!=='BRAND'){
    brandEl.hidden=true; brandEl.innerHTML=''; return;
  }
  const collator=new Intl.Collator('ko-KR',{numeric:true,sensitivity:'base'});
  const brandGroups=new Map();
  customerVisibleProducts().forEach(p=>{
    const label=String(p.brand||'').normalize('NFC').replace(/\s+/g,' ').trim();
    const key=brandKey(label);
    if(!key)return;
    const g=brandGroups.get(key)||{labels:new Map()};
    g.labels.set(label,(g.labels.get(label)||0)+1);
    brandGroups.set(key,g);
  });
  const brands=[...brandGroups.entries()].map(([key,g])=>({key,label:[...g.labels.entries()].sort((a,b)=>b[1]-a[1])[0][0]})).sort((a,b)=>collator.compare(a.label,b.label));
  brandEl.hidden=false;
  brandEl.innerHTML=[{key:'ALL',label:'ALL'},...brands].map(x=>`<button type="button" class="${brandFilter===x.key?'active':''}" data-brand="${x.key.replaceAll('"','&quot;')}">${x.label}</button>`).join('');
}

function render(){
  const accountLink=document.querySelector('.loginLink');
  if(accountLink)accountLink.textContent=user?'MYPAGE':'LOGIN';
  document.body.classList.toggle('guestMode',!user);
  if(!user){renderGuestGate();return}
  cats();renderQuickLinks();
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filterKey=JSON.stringify([category,categoryId,brandFilter,typeFilter,subTypeFilter,quickView,q,sortMode]);
  if(filterKey!==lastProductFilterKey){currentProductPage=1;lastProductFilterKey=filterKey;}
  const favIds=favoriteIds(),recentProductIds=recentIds(),newCutoff=Date.now()-30*24*60*60*1000;
  const visibleProducts=customerVisibleProducts();
  let a=visibleProducts.filter(p=>{
    const created=Date.parse(p.created_at||'')||0;
    const viewOk=quickView==='new'?created>=newCutoff:quickView==='favorites'?favIds.includes(String(p.id)):quickView==='recent'?recentProductIds.includes(String(p.id)):true;
    const productCategory=String(p.category||'').trim();
    let categoryOk=category==='ALL'||category==='BRAND';
    if(!categoryOk){
      const branchIds=categoryBranchIds(categoryId);
      if(p.category_id!=null){
        categoryOk=branchIds.has(String(p.category_id));
      }else{
        const legacyId=uniqueCategoryIdForName(productCategory);
        categoryOk=!!legacyId&&branchIds.has(String(legacyId));
      }
    }
    const brandOk=category!=='BRAND'||brandFilter==='ALL'||brandKey(p.brand)===brandFilter;
    const typeOk=productTypeMatches(p);
    return viewOk&&categoryOk&&brandOk&&typeOk&&String(p.name||'').toLowerCase().includes(q);
  });

  const stamp=v=>{
    const n=Date.parse(v||'');
    return Number.isFinite(n)?n:0;
  };
  const updateStamp=p=>stamp(p.updated_at)||stamp(p.created_at);
  const isSizeChartProduct=p=>p?.is_size_chart===true||/사이즈\s*표|size\s*guide/i.test(String(p?.name||''));
  const overallView=category==='ALL'||(category==='BRAND'&&brandFilter==='ALL');

  if(overallView){
    // 전체 상품(ALL)일 때 새로 등록된 상품(created_at)이 무조건 가장 먼저 오도록 최신순 정렬
    a.sort((x,y)=>stamp(y.created_at)-stamp(x.created_at)||updateStamp(y)-updateStamp(x)||(Number(x.sort_order)||0)-(Number(y.sort_order)||0));
  }else if(category!=='BRAND'){
    const selectedRow=categoryId?siteCategories.find(c=>String(c.id)===String(categoryId)):siteCategories.find(c=>String(c.name)===String(category));
    const exactCategoryId=selectedRow?String(selectedRow.id):null;
    const legacyCanResolve=selectedRow&&siteCategories.filter(c=>String(c.name)===String(selectedRow.name)).length===1;
    const categoryMatches=p=>p.category_id!=null
      ? String(p.category_id)===exactCategoryId
      : (!!legacyCanResolve&&String(p.category||'').trim()===String(selectedRow.name));
    const isPinnedHere=p=>categoryMatches(p)&&Number(p.sort_order)<0;
    const scopedOrder=p=>{
      if(isSizeChartProduct(p)&&Number(p.sort_order)<0&&!categoryMatches(p)) return Number.MAX_SAFE_INTEGER;
      return Number(p.sort_order)||0;
    };
    a.sort((x,y)=>{
      const xp=isPinnedHere(x),yp=isPinnedHere(y);
      if(xp!==yp)return xp?-1:1;
      return stamp(y.created_at)-stamp(x.created_at)||scopedOrder(x)-scopedOrder(y);
    });
  }else{
    a.sort((x,y)=>stamp(y.created_at)-stamp(x.created_at)||updateStamp(y)-updateStamp(x)||(Number(x.sort_order)||0)-(Number(y.sort_order)||0));
  }

  if(quickView==='new'){
    a.sort((x,y)=>(Date.parse(y.created_at||'')||0)-(Date.parse(x.created_at||'')||0)||(Date.parse(y.updated_at||'')||0)-(Date.parse(x.updated_at||'')||0));
  }else if(quickView==='favorites'){
    a.sort((x,y)=>favIds.indexOf(String(x.id))-favIds.indexOf(String(y.id)));
  }else if(quickView==='recent'){
    a.sort((x,y)=>recentProductIds.indexOf(String(x.id))-recentProductIds.indexOf(String(y.id)));
  }

  // 중복 상품 제거 기능 유지
  const normalizeProductName=v=>String(v??'')
    .normalize('NFKC')
    .replace(/[\s\u00a0]+/g,'')
    .trim()
    .toLocaleLowerCase('ko-KR');
  const seenProducts=new Set();
  a=a.filter(p=>{
    const key=normalizeProductName(p.name);
    if(!key) return true;
    const dedupeKey=brandKey(p.brand)+'|'+key;
    if(seenProducts.has(dedupeKey)) return false;
    seenProducts.add(dedupeKey);
    return true;
  });

  if(sortMode!=='default'){
    const unit=p=>Number(getPrice(p)??p.normal_price)||0;
    const dir=sortMode==='low'?1:-1;
    a=a.map((p,i)=>({p,i})).sort((x,y)=>{const sx=soldFlag(x.p),sy=soldFlag(y.p);if(sx!==sy)return sx?1:-1;return (unit(x.p)-unit(y.p))*dir||x.i-y.i}).map(o=>o.p);
  }
  const sortEl=document.getElementById('sortSelect');if(sortEl&&sortEl.value!==sortMode)sortEl.value=sortMode;
  const totalPages=Math.max(1,Math.ceil(a.length/PRODUCTS_PER_PAGE));
  currentProductPage=Math.max(1,Math.min(currentProductPage,totalPages));
  const pageStart=(currentProductPage-1)*PRODUCTS_PER_PAGE;
  const pageProducts=a.slice(pageStart,pageStart+PRODUCTS_PER_PAGE);
  document.getElementById('grid').innerHTML=a.length?pageProducts.map(card).join(''):'<div class="empty">등록된 상품이 없어요 🤍</div>';
  renderPagination(a.length);
}
function renderPagination(totalItems){
  const nav=document.getElementById('pagination');
  if(!nav)return;
  const pages=Math.ceil(totalItems/PRODUCTS_PER_PAGE);
  nav.dataset.totalPages=String(Math.max(1,pages));
  if(pages<=1){nav.hidden=true;nav.innerHTML='';return;}
  nav.hidden=false;
  const parts=[];
  parts.push(`<button type="button" aria-label="이전 페이지" ${currentProductPage<=1?'disabled':''} onclick="goToProductPage(${currentProductPage-1})">‹</button>`);
  const included=new Set([1,pages]);
  for(let n=Math.max(1,currentProductPage-2);n<=Math.min(pages,currentProductPage+2);n++)included.add(n);
  const ordered=[...included].sort((a,b)=>a-b);
  let prev=0;
  for(const n of ordered){
    if(prev&&n-prev>1)parts.push('<span class="pageGap" aria-hidden="true">…</span>');
    parts.push(`<button type="button" class="${n===currentProductPage?'active':''}" ${n===currentProductPage?'aria-current="page"':''} onclick="goToProductPage(${n})">${n}</button>`);
    prev=n;
  }
  parts.push(`<button type="button" aria-label="다음 페이지" ${currentProductPage>=pages?'disabled':''} onclick="goToProductPage(${currentProductPage+1})">›</button>`);
  nav.innerHTML=parts.join('');
}
function goToProductPage(page){
  const nav=document.getElementById('pagination');
  const totalPages=Number(nav?.dataset.totalPages)||Math.max(1,Math.ceil(products.length/PRODUCTS_PER_PAGE));
  const nextPage=Math.max(1,Math.min(totalPages,Math.floor(Number(page)||1)));
  if(nextPage===currentProductPage)return;
  currentProductPage=nextPage;
  render();
  // 애니메이션 없이 바로 새 페이지의 첫 상품 위치로 이동
  const grid=document.getElementById('grid');
  if(grid){
    const header=document.querySelector('header');
    const headerHeight=header?header.getBoundingClientRect().height:0;
    const top=grid.getBoundingClientRect().top;
    if(top<headerHeight)window.scrollTo({top:Math.max(0,window.scrollY+top-headerHeight-12),behavior:'auto'});
  }
}

  el.innerHTML=`<div class="inner"><div class="topbar"><button class="back" onclick="openCart()">← 장바구니</button><b>주문서</b><span></span></div><div class="orderSummary">${excludedCount?`<div class="soldOutNotice">품절·판매 종료된 상품 ${excludedCount}개는 제외하고 주문서를 작성해요.</div>`:''}${checkoutDraft?'<div style="padding:0 0 9px;color:#9b6f55;font-weight:600">바로 구매 상품</div>':''}${rows}<div style="padding-top:12px;font-size:14px;line-height:1.9"><div style="display:flex;justify-content:space-between"><span>정상가</span><b>${won(normalTotal)}</b></div>${member&&discount>0?`<div style="display:flex;justify-content:space-between;color:#9b6f55"><span>회원특별할인</span><b>- ${won(discount)}</b></div>`:''}<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:16px"><span>상품금액</span><b>${won(total)}</b></div><div style="display:flex;justify-content:space-between"><span>배송비</span><b>${won(3500)}</b></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:17px;font-weight:700"><span>배송비 포함 총액</span><b>${won(total+3500)}</b></div></div></div><div class="orderForm"><label>성함</label><input id="orderName" placeholder="성함을 입력해주세요"><label>연락처</label><input id="orderPhone" placeholder="연락처를 입력해주세요"><label>배송지 <span style="font-size:11px;color:var(--muted);font-weight:400">(주소를 정확히 입력해주세요.)</span></label><input id="orderAddress" placeholder="배송지를 직접 입력해주세요"><label>요청사항</label><textarea id="orderMemo" placeholder="요청사항이 있다면 입력해주세요"></textarea><label class="combineShipRow" for="combineShipping"><input type="checkbox" id="combineShipping"><span>합배요청</span></label><div class="combineShipNote">※ 합배요청 시 배송기간이 늘어날 수 있다는 점 참고해주세요.<br>※ 합배요청 시 이벤트로 지급되는 첫구매 적립금(5,000원)은 사용이 불가합니다.</div><div class="checkoutPoints"><div class="checkoutPointsHead"><span>보유 적립금</span><b id="checkoutPointsBalance">조회 중...</b></div><div class="checkoutPointsInputRow"><div><label for="pointsToUse">사용할 적립금 (1원 = 1P)</label><input id="pointsToUse" type="number" min="0" step="1" inputmode="numeric" value="0" disabled oninput="updateCheckoutPointsPreview()" onblur="normalizeCheckoutPointsInput()"></div><button type="button" onclick="useAllLoyaltyPoints()" id="useAllPointsButton" disabled>모두 사용</button></div><div id="checkoutPointsHint" class="checkoutPointsHint">적립금 잔액을 불러오고 있어요.</div><div class="checkoutPointsTotal"><span>적립금 적용 후 입금 예정액<br><small style="font-weight:400;color:var(--muted)">배송비 3,500원 포함</small></span><b id="checkoutPointsFinalTotal">${won(total+3500)}</b></div></div><button class="primary" style="padding:13px;border:0;border-radius:11px;background:var(--ink);color:white;cursor:pointer" onclick="submitOrder()">주문서 제출하기</button></div></div>`;

const POINTS_MIN_ORDER_TOTAL=30000;
async function loadCheckoutPointBalance(subtotal){
  checkoutProductTotal=Math.max(0,Math.round(Number(subtotal)||0));
  loyaltyPointsBalance=0;loyaltyPointsReady=false;
  const balanceEl=document.getElementById('checkoutPointsBalance');
  const input=document.getElementById('pointsToUse');
  const allBtn=document.getElementById('useAllPointsButton');
  const hint=document.getElementById('checkoutPointsHint');
  if(!balanceEl||!input)return;
  input.value='0';input.disabled=true;if(allBtn)allBtn.disabled=true;
  const {data:{user:currentUser},error:authError}=await sb.auth.getUser();
  if(authError||!currentUser){balanceEl.textContent='0원';if(hint)hint.textContent='로그인한 회원만 적립금을 사용할 수 있어요.';updateCheckoutPointsPreview();return}
  try{
    const {data,error}=await sb.rpc('get_my_loyalty_points_balance');
    if(error)throw error;
    loyaltyPointsBalance=Math.max(0,Math.floor(Number(data)||0));loyaltyPointsReady=true;
    balanceEl.textContent=won(loyaltyPointsBalance);
    const pointsUsable=loyaltyPointsBalance>0&&checkoutProductTotal>=POINTS_MIN_ORDER_TOTAL;
    input.disabled=!pointsUsable;input.max=String(Math.min(loyaltyPointsBalance,checkoutProductTotal));
    if(allBtn)allBtn.disabled=!(pointsUsable&&checkoutProductTotal>0);
    if(hint)hint.textContent=pointsUsable?`최대 ${won(Math.min(loyaltyPointsBalance,checkoutProductTotal))}까지 사용할 수 있어요.`:(loyaltyPointsBalance>0?`상품 주문금액이 ${won(POINTS_MIN_ORDER_TOTAL)} 이상일 때 적립금을 사용할 수 있어요. (현재 ${won(checkoutProductTotal)})`:'사용 가능한 적립금이 없어요.');
  }catch(e){
    console.warn('체크아웃 적립금 조회 실패:',e);
    balanceEl.textContent='확인 필요';input.disabled=true;if(allBtn)allBtn.disabled=true;
    if(hint)hint.textContent='적립금 설정을 확인할 수 없어 이번 주문에서는 적립금 사용을 잠시 제한했어요.';
  }
  updateCheckoutPointsPreview();
}
function requestedCheckoutPoints(){const el=document.getElementById('pointsToUse');return Math.max(0,Math.floor(Number(el?.value)||0))}
function updateCheckoutPointsPreview(){
  const input=document.getElementById('pointsToUse');const hint=document.getElementById('checkoutPointsHint');const totalEl=document.getElementById('checkoutPointsFinalTotal');if(!totalEl)return;
  const requested=requestedCheckoutPoints();const maximum=Math.min(loyaltyPointsBalance,checkoutProductTotal);const applied=Math.min(requested,maximum,checkoutProductTotal);totalEl.textContent=won(Math.max(0,checkoutProductTotal-applied)+3500);
  if(input&&requested>maximum){if(hint)hint.textContent=`사용 가능 적립금은 최대 ${won(maximum)}이에요. 금액을 확인해주세요.`}
  else if(hint&&loyaltyPointsReady&&loyaltyPointsBalance>0&&checkoutProductTotal>=POINTS_MIN_ORDER_TOTAL)hint.textContent=`${requested>0?won(requested)+' 사용 · ':''}최대 ${won(maximum)}까지 사용할 수 있어요.`;
}
function normalizeCheckoutPointsInput(){const input=document.getElementById('pointsToUse');if(!input||input.disabled)return;const max=Math.min(loyaltyPointsBalance,checkoutProductTotal);input.value=String(Math.max(0,Math.min(max,Math.floor(Number(input.value)||0))));updateCheckoutPointsPreview()}
function useAllLoyaltyPoints(){const input=document.getElementById('pointsToUse');if(!input||input.disabled)return;input.value=String(Math.min(loyaltyPointsBalance,checkoutProductTotal));updateCheckoutPointsPreview()}

async function submitOrder(){
  const {data:{user:authenticatedUser},error:authError}=await sb.auth.getUser();
  if(authError||!authenticatedUser){alert('주문하시려면 먼저 로그인해주세요.');closeAll();openLogin();return}
  user=authenticatedUser;
  const n=document.getElementById('orderName').value.trim(),ph=document.getElementById('orderPhone').value.trim(),ad=document.getElementById('orderAddress').value.trim(),memo=document.getElementById('orderMemo').value.trim();
  if(!n||!ph||!ad)return alert('성함, 연락처, 배송지를 입력해주세요.');
  const combineShipping=!!document.getElementById('combineShipping')?.checked;
  const memoToSend=combineShipping?('[합배요청]'+(memo?' '+memo:'')):memo;
  const isDirectBuy=Array.isArray(checkoutDraft);
  if(!isDirectBuy)loadCart();
  const sourceItems=isDirectBuy?checkoutDraft:cart;
  if(!sourceItems?.length)return alert('주문할 상품이 없어요 🤍');
  await syncSoldOut(sourceItems.map(x=>x.id));
  const orderableItems=sourceItems.filter(isOrderableItem);
  const droppedItems=sourceItems.filter(x=>!isOrderableItem(x));
  if(!orderableItems.length){alert('선택한 상품이 모두 품절되었어요.\n장바구니를 확인해주세요.');openCart();return}
  if(droppedItems.length&&!confirm(`품절된 상품 ${droppedItems.length}개를 제외하고 주문서를 제출할까요?\n\n${droppedItems.map(x=>'· '+x.name).join('\n')}`))return;
  const items=orderableItems.map(x=>{const p=products.find(p=>String(p.id)===String(x.id));if(!p)return null;const unit=getPrice(p)+Number(x.add||0);return {id:p.id,name:p.name,brand:p.brand||'',color:x.color||'',size:x.size||'',one_plus_one:isOnePlus(p),qty:x.qty,unit_price:unit,line_total:unit*x.qty,image:p.images?.[0]||''}}).filter(Boolean);
  if(!items.length)return alert('주문할 상품을 다시 확인해주세요.');
  const total=Math.round(items.reduce((a,x)=>a+x.line_total,0));
  const pointsInput=document.getElementById('pointsToUse');
  const pointsUsed=pointsInput&&!pointsInput.disabled?Math.max(0,Math.floor(Number(pointsInput.value)||0)):0;
  if(pointsUsed>0&&!loyaltyPointsReady)return alert('적립금 잔액을 확인하지 못했어요. 페이지를 새로 열고 다시 시도해주세요.');
  if(pointsUsed>0&&total<POINTS_MIN_ORDER_TOTAL)return alert('상품 주문금액이 3만원 이상일 때 적립금을 사용할 수 있어요.');
  if(pointsUsed>Math.min(loyaltyPointsBalance,total))return alert('사용할 적립금이 보유 적립금 또는 상품 금액을 초과했어요.');
  if(orderSubmissionInProgress)return;
  orderSubmissionInProgress=true;
  const submitButton=document.querySelector('#cart .orderForm button[onclick="submitOrder()"]');
  if(submitButton){submitButton.disabled=true;submitButton.dataset.originalText=submitButton.textContent;submitButton.textContent='주문 접수 중...';submitButton.style.opacity='.65';}
  const {data:orderResult,error}=await sb.rpc('create_order_with_points',{p_customer_name:n,p_phone:ph,p_address:ad,p_memo:memoToSend,p_items:items,p_total_price:total,p_points_used:pointsUsed});
  if(error){
    orderSubmissionInProgress=false;
    if(submitButton){submitButton.disabled=false;submitButton.textContent=submitButton.dataset.originalText||'주문서 제출하기';submitButton.style.opacity='1';}
    console.error('order with loyalty points failed:',error);
    const message=String(error.message||'');
    if(message.includes('INSUFFICIENT_POINTS'))return alert('보유 적립금이 변경되었어요. 적립금 잔액을 새로 확인한 뒤 다시 주문해주세요.');
    if(message.includes('AUTH_REQUIRED'))return alert('로그인이 만료되었어요. 다시 로그인해주세요.');
    return alert('주문서 저장 중 문제가 생겼어요. '+message+'\n\n적립금 설정 SQL이 적용되어 있는지 확인해주세요.');
  }
  if(!isDirectBuy){
    cart=cart.filter(x=>!orderableItems.includes(x));
    save();
  }
  checkoutDraft=null;
  orderSubmissionInProgress=false;
  const payable=Math.max(0,total-pointsUsed)+3500;
  const el=document.getElementById('cart');el.innerHTML=`<div class="inner"><div class="topbar"><button class="back" onclick="closeLayer('cart')">←</button><b>주문서 접수</b><span></span></div><div class="orderDone"><strong>주문해주셔서 감사합니다 🤍</strong><br><br>${pointsUsed>0?`적립금 ${won(pointsUsed)} 사용 · `:''}입금 예정액 ${won(payable)} (배송비 ${won(3500)} 포함)<br><br><strong>바이재이에게 1:1 채팅을 통해 주문을 확인해주세요 🤍</strong><br><button class="continueShopping" onclick="closeLayer('cart')">쇼핑 계속하기</button></div></div>`;
}
function orderStatusClass(status){return ({'입금확인':'paid','상품준비중':'prep','배송준비':'prep','배송중':'shipped','배송완료':'done','취소':'cancel'})[status]||''}
function orderStatusMessage(status){return ({'주문접수':'주문서가 접수되었어요. 입금 안내를 기다려주세요.','입금확인':'입금 확인이 완료되었어요.','상품준비중':'상품을 준비하고 있어요.','배송준비':'배송을 준비하고 있어요.','배송중':'상품이 발송되었어요. 아래 배송 조회를 이용해 주세요.','배송완료':'배송 완료로 처리되었어요.','취소':'취소 처리된 주문이에요.'})[status]||'주문 상태를 확인 중이에요.'}
function safeText(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function loadMyOrders(){
  if(!user){alert('로그인 후 주문 내역을 확인할 수 있어요.');return}

    const baseCols='id,created_at,items,total_price,points_used,payable_total,status';
    const colSets=[baseCols+',shipping_carrier,tracking_number,cancel_reason,preship_tracking',baseCols+',shipping_carrier,tracking_number,cancel_reason',baseCols+',shipping_carrier,tracking_number',baseCols+',cancel_reason',baseCols];
    let result=null;
    for(const cols of colSets){
      result=await sb.from('orders').select(cols).eq('user_id',user.id).order('created_at',{ascending:false});
      if(!result.error)break;
      const message=String(result.error.message||'');
      if(!(/shipping_carrier|tracking_number|cancel_reason|preship_tracking/i.test(message)&&/(column|schema cache|does not exist|could not find|not found)/i.test(message)))break;
    }
    if(result.error)throw result.error;
    const data=result.data||[];
    const target=el.querySelector('.myOrders');
    if(!data.length){target.innerHTML=emptyOrderMessage;return}
    target.innerHTML=data.map(o=>{
      const status=o.status||'주문접수';
      const items=Array.isArray(o.items)?o.items:[];
      const itemHtml=items.map(i=>`<div class="myOrderItem">${i.image?`<img src="${safeText(i.image)}" alt="${safeText(i.name)}">`:''}<div>${i.one_plus_one?'<span class="opBadge">1+1</span>':''}<b>${safeText(i.name)}</b><br><span class="small">${safeText(i.color||'')}${i.color&&i.size?' / ':''}${safeText(i.size||'')} · ${Number(i.qty||1)}개</span>${(()=>{const t=[];if(i.received===true&&status!=='취소')t.push('<span class="recvTag">입고완료</span>');if(i.pre_shipped===true&&status!=='취소')t.push('<span class="recvTag shipTag">선발송완료</span>');if(i.sold_out===true)t.push('<span class="recvTag soldTag">품절</span>');if(i.refunded===true)t.push('<span class="recvTag refundTag">환불완료</span>');return t.length?'<br>'+t.join(' '):''})()}</div><span>${won(i.line_total??(Number(i.unit_price||0)*Number(i.qty||1)))}</span></div>`).join('');
      const carrier=safeText(o.shipping_carrier||''),tracking=safeText(o.tracking_number||'');
      const trackingUrl=o.shipping_carrier&&o.tracking_number?'https://search.naver.com/search.naver?query=%ED%83%9D%EB%B0%B0%EB%B0%B0%EC%86%A1+%EC%A1%B0%ED%9A%8C':'';
      const date=o.created_at?new Date(o.created_at).toLocaleString('ko-KR'):'-';
      return `<article class="myOrder"><div class="myOrderHead"><div><div class="myOrderDate">주문일 ${safeText(date)}</div><b>주문번호 #${safeText(o.id)}</b></div><div class="myOrderStatus ${orderStatusClass(status)}">${safeText(status)}</div></div><div class="small" style="margin-top:7px">${safeText(orderStatusMessage(status))}</div>${status==='취소'&&o.cancel_reason?`<div class="myOrderCancelReason"><b>취소 사유</b><br>${safeText(o.cancel_reason)}</div>`:''}${(()=>{const n=items.filter(x=>x.received===true).length;return n&&status!=='취소'?`<div class="recvSummary">입고 ${n}/${items.length} · ${n===items.length?'모든 상품이 입고됐어요':'입고된 상품은 아래에서 확인하세요'}</div>`:''})()}${(()=>{const n=items.filter(x=>x.pre_shipped===true).length;return n&&status!=='취소'?`<div class="recvSummary shipSummary">선발송 ${n}/${items.length} · 선발송된 상품은 아래 운송장으로 조회하세요</div>`:''})()}<div class="myOrderItems">${itemHtml}</div><div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13px;line-height:1.8"><div style="display:flex;justify-content:space-between"><span>상품 금액</span><b>${won(o.total_price)}</b></div>${Number(o.points_used||0)>0?`<div style="display:flex;justify-content:space-between;color:#9b6f55"><span>사용 적립금</span><b>- ${won(o.points_used)}</b></div>`:''}<div style="display:flex;justify-content:space-between;font-size:14px"><span>적립금 적용 후 상품 금액</span><b>${won(o.payable_total??Math.max(0,Number(o.total_price||0)-Number(o.points_used||0)))}</b></div></div>${(()=>{const pt=(Array.isArray(o.preship_tracking)?o.preship_tracking:[]).filter(t=>t&&t.number).slice(0,3);if(!pt.length||status==='취소')return'';return`<div class="myOrderShipping"><b>선발송 운송장</b>${pt.map((t,n)=>{const u='https://search.naver.com/search.naver?query=%ED%83%9D%EB%B0%B0%EB%B0%B0%EC%86%A1+%EC%A1%B0%ED%9A%8C';return`<br>${n+1}. ${safeText(t.carrier||'')} · ${safeText(t.number)}<a href="${u}" target="_blank" rel="noopener noreferrer">배송 조회 ↗</a>`}).join('')}</div>`})()}${carrier||tracking?`<div class="myOrderShipping"><b>배송 정보</b><br>${carrier?`택배사 · ${carrier}<br>`:''}${tracking?`송장번호 · ${tracking}`:''}${trackingUrl?`<a href="${trackingUrl}" target="_blank" rel="noopener noreferrer">배송 조회 ↗</a>`:''}</div>`:status==='배송중'||status==='배송완료'?'<div class="myOrderShipping">배송 정보가 아직 등록되지 않았어요.</div>':''}${status==='주문접수'?`<button type="button" class="myOrderCancel" onclick="cancelMyOrder(${Number(o.id)})">주문 취소</button><div class="small" style="margin-top:6px;text-align:center">입금 확인 전에만 취소할 수 있어요.</div>`:''}</article>`;
    }).join('');
  }catch(e){
    console.error('Order history request failed:',e);
    const target=el.querySelector('.myOrders');
    if(target)target.innerHTML=emptyOrderMessage;
  }
}
async function cancelMyOrder(id){
  if(!confirm('이 주문을 취소할까요?\n\n입금 확인 전 주문만 취소할 수 있고, 사용한 적립금이 있으면 취소 후 돌려드려요.'))return;
  const {error}=await sb.rpc('cancel_my_order',{p_order_id:id});
  if(error){
    console.error('cancel_my_order 실패',error);
    const m=String(error.message||''),code=String(error.code||'');
    const detail='\n\n(관리자 확인용: '+(code?code+' · ':'')+m+')';
    if(m.includes('NOT_CANCELLABLE'))alert('이미 입금 확인이 진행된 주문은 직접 취소할 수 없어요.\n채팅으로 문의해주세요.');
    else if(m.includes('AUTH_REQUIRED'))alert('로그인이 만료되었어요. 다시 로그인해주세요.');
    else if(m.includes('ORDER_NOT_FOUND'))alert('주문 정보를 찾지 못했어요. 새로고침 후 다시 시도해주세요.'+detail);
    else if(code==='PGRST202'||/could not find the function/i.test(m))alert('주문 취소 기능이 아직 켜지지 않았어요.\n채팅으로 취소를 요청해주세요.'+detail);
    else alert('주문 취소 중 문제가 생겼어요.\n채팅으로 취소를 요청해주세요.'+detail);
    return;
  }
  alert('주문이 취소되었어요.');
  loadMyOrders();
}

async function openLogin(){
  closeAll();
  const el=document.getElementById('login');
  el.hidden=false;
  let {data:{session}}=await sb.auth.getSession();
  if(session){
    user=session.user;
    el.innerHTML=`<div class="inner"><div class="topbar myPageTopbar"><button class="back" onclick="closeLayer('login')">←</button><b>MYPAGE</b><span></span></div><div class="loginForm myPageForm"><div class="accountWelcome"><span class="accountEyebrow">회원 정보</span><p class="accountEmail">${safeText(user.email)}</p><p class="small">${approved?'회원 승인이 완료되어 회원가가 적용돼요.':'회원 승인 대기 중이에요.'}</p></div><div class="loyaltyCard" id="myPageLoyaltyCard"><div class="loyaltyCardHead"><div><div class="loyaltyCardLabel">보유 적립금</div><div id="myPagePointsBalance" class="loyaltyCardValue">조회 중...</div></div><span aria-hidden="true" style="font-size:24px;color:#a78c73">♡</span></div><div id="myPagePointsHint" class="small" style="margin-top:5px">적립금 잔액을 확인하고 있어요.</div><div id="myPagePointsHistory" class="loyaltyHistory" hidden></div></div><button onclick="loadMyOrders()">주문 내역 확인 <span aria-hidden="true">↗</span></button><button class="secondary" onclick="logout()">LOG OUT</button></div></div>`;

  }

async function login(){let e=document.getElementById('email').value.trim(),p=document.getElementById('pw').value;if(!e||!p)return alert('이메일과 비밀번호를 입력해주세요.');if(document.getElementById('saveEmail')?.checked)localStorage.setItem('byjaei_saved_email',e);else localStorage.removeItem('byjaei_saved_email');let {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){return alert(error.message||'로그인에 실패했어요.')}const {data:pr}=await sb.from('profiles').select('approved,withdrawn').eq('id',(await sb.auth.getUser()).data.user.id).maybeSingle();if(pr?.withdrawn){await sb.auth.signOut();user=null;approved=false;return alert('탈퇴 처리된 회원이에요.\n새로 가입해서 이용해주세요.')}if(!pr?.approved){await sb.auth.signOut();user=null;approved=false;return alert('승인대기중이에요.\n관리자 승인 후 이용 가능해요.')}await refreshUser();closeLayer('login');loadCart();syncFavorites();await load();render()}
async function signup(){closeAll();const el=document.getElementById('login');el.hidden=false;el.innerHTML=`<div class="inner"><div class="topbar"><button class="back" onclick="openLogin()">← 돌아가기</button><b>회원가입</b><span></span></div><div class="loginForm"><input id="signupName" placeholder="이름"><input id="signupPhone" type="tel" placeholder="연락처"><input id="signupEmail" type="email" placeholder="이메일"><input id="signupPw" type="password" placeholder="비밀번호 (6자 이상)"><input id="signupPwConfirm" type="password" placeholder="비밀번호 확인 (다시 입력)"><label for="signupReferral" style="display:block;font-size:12px;color:var(--muted);margin:2px 0 -4px">가입경로 (필수로 작성 부탁드려요)</label><input id="signupReferral" required placeholder="예: ㅇㅇㅇ 맘카페, ㅇㅇㅇ 인스타, 지인 ㅇㅇㅇ"><div class="small" style="margin-top:-4px">가입 경로를 꼭 작성해주세요.</div><button onclick="submitSignup()">회원가입</button><div class="small">가입 후 관리자 승인 전까지는 회원가가 적용되지 않아요.</div></div></div>`}
async function submitSignup(){const name=document.getElementById('signupName').value.trim(),phone=document.getElementById('signupPhone').value.trim(),e=document.getElementById('signupEmail').value.trim(),p=document.getElementById('signupPw').value,pc=document.getElementById('signupPwConfirm').value,ref=document.getElementById('signupReferral').value.trim();if(!name||!phone||!e||p.length<6)return alert('이름, 연락처, 이메일을 입력하고 비밀번호는 6자 이상으로 설정해주세요.');if(!ref)return alert('가입경로를 필수로 작성해주세요. 예: ㅇㅇㅇ 맘카페, ㅇㅇㅇ 인스타, 지인 ㅇㅇㅇ 등');if(p!==pc)return alert('비밀번호와 비밀번호 확인이 일치하지 않아요.');const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name,phone,referral_source:ref}}});if(error)return alert(error.message);if(data.user){const {error:pe}=await sb.from('profiles').upsert({id:data.user.id,name,email:e,phone,referral_source:ref,approved:false},{onConflict:'id'});if(pe)console.warn('프로필 저장은 트리거에서 처리됩니다.',pe)}try{await sb.auth.signOut()}catch(_){}user=null;approved=false;products=[];productsLoaded=false;alert('가입이 완료됐어요.\n🤍\n\n승인대기중이에요.\n관리자 승인 후 이용 가능해요.');openLogin()}
async function logout(){await sb.auth.signOut();user=null;approved=false;checkoutDraft=null;products=[];productsLoaded=false;closeLayer('login');render()}

async function refreshUser(){
  let {data:{user:u}}=await sb.auth.getUser();
  user=u||null;
  approved=false;
  if(user){
    const {data:p}=await sb.from('profiles').select('approved,is_admin,withdrawn').eq('id',user.id).maybeSingle();

  }
}

refreshUser().catch(e=>console.warn('회원 정보 확인 실패',e)).then(()=>{authReady=true;authReadyResolve();loadCart();syncFavorites();return load()}).then(()=>{window.__bootDone=true}).catch(e=>{console.error(e);if(window.__bootError)window.__bootError(e&&e.message||e)});
