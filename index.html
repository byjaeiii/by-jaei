<script>
const {createClient}=supabase;const sb=createClient(BYJAEI_CONFIG.supabaseUrl,BYJAEI_CONFIG.supabaseKey);let products=[],siteCategories=[],category='ALL',categoryId=null,brandFilter='ALL',user=null,approved=false,cart=[];
const guestCartKey='byjaei_cart_guest';
function cartKey(){return user?.id?`byjaei_cart_${user.id}`:guestCartKey}
function loadCart(){
  try{
    const raw=localStorage.getItem(cartKey());
    const parsed=raw?JSON.parse(raw):[];
    cart=Array.isArray(parsed)?parsed:[];
  }catch(e){console.warn('장바구니 데이터를 복구했어요.',e);cart=[];localStorage.removeItem(cartKey())}
}
function save(){localStorage.setItem(cartKey(),JSON.stringify(cart))}
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';const getPrice=p=>approved&&user?(p.member_price??p.normal_price):p.normal_price;

async function load(){
  const [{data:productData,error:productError},{data:categoryData,error:categoryError}]=await Promise.all([
    sb.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false}),
    sb.from('categories').select('id,name,parent_id,sort_order,created_at').order('sort_order',{ascending:true}).order('created_at',{ascending:true})
  ]);
  if(productError){console.error(productError);grid.innerHTML='<div class="empty">상품을 불러오지 못했어요. Supabase 연결을 확인해주세요.</div>';return}
  products=productData||[];
  siteCategories=categoryError?[]:(categoryData||[]);
  if(categoryError)console.error(categoryError);
  render();
}

function setCategory(x,id=null){
  category=x;

function categoryTreeRows(parentId=null,depth=0,rows=[]){
  siteCategories.filter(c=>String(c.parent_id??'')===String(parentId??'')).sort((x,y)=>(Number(x.sort_order)||0)-(Number(y.sort_order)||0)||String(x.name).localeCompare(String(y.name),'ko-KR',{numeric:true})).forEach(c=>{rows.push({c,depth});categoryTreeRows(c.id,depth+1,rows)});
  return rows;
}
function categoryDescendantNames(name){
  const clean=v=>String(v||'').replace(/\s+/g,'').toUpperCase();
  const root=siteCategories.find(c=>String(c.name)===String(name));
  if(!root)return [String(name)];
  const out=[];
  const walk=id=>{
    const c=siteCategories.find(x=>String(x.id)===String(id));
    if(c&&clean(c.name)!=='26WINTER(전체보기)')out.push(String(c.name));
    siteCategories.filter(x=>String(x.parent_id??'')===String(id??'')).forEach(x=>walk(x.id));
  };
  walk(root.id);return [...new Set(out)];
}

    let current=c;
    const seen=new Set();
    while(current && current.parent_id!=null && !seen.has(String(current.id))){
      seen.add(String(current.id));

    }

  }).join('');

  brandEl.innerHTML=['ALL',...brands].map(x=>`<button type="button" class="${brandFilter===x?'active':''}" data-brand="${x.replaceAll('"','&quot;')}">${x}</button>`).join('');
}

  setCategory(b.dataset.category,b.dataset.categoryId||null);
});
document.getElementById('brandCats').addEventListener('click',e=>{
  const b=e.target.closest('button[data-brand]');
  if(!b) return;
  setBrandFilter(b.dataset.brand);
});
